name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Test
        run: pytest -q
      - name: Build
        run: pyinstaller --noconfirm --clean --windowed --name NetScope app.py
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/NetScope/* -DestinationPath NetScope-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-x64
          path: NetScope-Windows-x64.zip
