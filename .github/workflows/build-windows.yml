name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest
      - name: Verify imports
        run: python -c "from core.network import calculate_network; print(calculate_network('192.168.1.10/24'))"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name NetScope app.py
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/NetScope/* -DestinationPath NetScope-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-x64
          path: NetScope-Windows-x64.zip
